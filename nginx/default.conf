server {
    listen 80;
    server_name alumno5bg.duckdns.org;

    # Ruta específica para la información de administración / Kestrel
    location = /api/kestrel-info {
        proxy_pass http://web_api:8080/api/kestrel-info;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Ruta general para el resto de la API
    location / {
        proxy_pass http://web_api:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}